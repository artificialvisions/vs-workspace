<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VS Studio Workspace</title>
<link rel="icon" href="https://vincenzosalvia.wordpress.com/wp-content/uploads/2026/03/workspace-logo.png">
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
  @font-face { font-family:'Futura PT'; src:local('Futura PT'),local('Futura Bold'),local('Futura'); }
  :root {
    --bg: #0d0d10;
    --bubble-bg: #1a1a20;
    --bubble-v-bg: #10BADA;
    --border: rgba(60,60,70,0.4);
    --cyan: #10BADA;
    --blue: #267aaa;
    --pink: #ff7dab;
    --text: #e0ddd6;
    --text2: #aaa;
    --text3: #666;
    --text4: #444;
    --heading: #f0eee8;
    --radius: 18px;
  }
  * { margin:0; padding:0; box-sizing:border-box; }
  body { font-family:'Outfit',sans-serif; background:var(--bg); color:var(--text); height:100vh; display:flex; flex-direction:column; overflow:hidden; line-height:1.55; font-weight:300; }
  .title-font { font-family:'Futura PT','Futura Bold',Futura,'Outfit',sans-serif; text-transform:uppercase; letter-spacing:0.05em; }
  @keyframes spin { to{transform:rotate(360deg);} }
  @keyframes fadeIn { from{opacity:0;transform:translateY(8px)} to{opacity:1;transform:translateY(0)} }

  ::-webkit-scrollbar { width:6px; }
  ::-webkit-scrollbar-track { background:transparent; }
  ::-webkit-scrollbar-thumb { background:rgba(80,80,90,0.3); border-radius:10px; }
  ::-webkit-scrollbar-thumb:hover { background:rgba(100,100,110,0.5); }

  .header { padding:14px 20px; background:rgba(18,18,22,0.98); backdrop-filter:blur(12px); display:flex; align-items:center; justify-content:space-between; gap:12px; border-bottom:1px solid var(--border); }
  .header-left { display:flex; align-items:center; gap:12px; }
  .header-logo { width:36px; height:36px; border-radius:10px; object-fit:cover; }
  .header-title { font-size:15px; color:var(--heading); letter-spacing:0.06em; }
  .header-sub { font-size:11px; color:var(--text3); font-weight:300; margin-top:1px; }
  .header-right { display:flex; gap:6px; align-items:center; }
  .search-input { background:rgba(40,40,48,0.6); border:1px solid var(--border); border-radius:12px; padding:6px 12px; color:var(--text); font-size:12px; outline:none; width:140px; font-family:'Outfit',sans-serif; font-weight:300; transition:all 0.2s; }
  .search-input:focus { border-color:var(--cyan); box-shadow:0 0 0 3px rgba(16,186,218,0.1); }
  .search-input::placeholder { color:var(--text3); }
  .btn { background:rgba(40,40,48,0.6); border:1px solid var(--border); border-radius:12px; padding:6px 10px; color:var(--text3); cursor:pointer; font-size:13px; transition:all 0.2s; line-height:1; }
  .btn:hover { color:var(--cyan); border-color:var(--cyan); }
  .btn.spinning { color:var(--cyan); animation:spin 1s linear infinite; }

  .filters { display:flex; gap:5px; padding:8px 20px; overflow-x:auto; background:rgba(13,13,16,0.98); border-bottom:1px solid rgba(30,30,35,0.5); }
  .filter-btn { background:transparent; border:1px solid transparent; border-radius:20px; padding:5px 14px; cursor:pointer; color:var(--text3); font-size:12px; white-space:nowrap; transition:all 0.2s; font-family:'Outfit',sans-serif; font-weight:400; }
  .filter-btn:hover { color:var(--text2); }
  .filter-btn.active { font-weight:600; }
  .filter-count { margin-left:4px; opacity:0.3; font-size:10px; }

  .status { padding:6px 20px; text-align:center; font-size:12px; font-weight:400; }
  .status.sent { background:rgba(16,186,218,0.08); color:var(--cyan); }
  .status.refreshed { background:rgba(16,186,218,0.06); color:var(--blue); }
  .status.error { background:rgba(255,125,171,0.06); color:var(--pink); }

  .chat { flex:1; overflow-y:auto; padding:16px 20px; display:flex; flex-direction:column; gap:6px; }
  .date-sep { text-align:center; margin:18px 0 8px; }
  .date-label { font-size:11px; color:var(--text3); background:rgba(26,26,32,0.9); padding:4px 14px; border-radius:12px; font-weight:400; letter-spacing:0.03em; }

  .bubble-row { display:flex; gap:12px; align-items:flex-start; max-width:80%; margin-bottom:4px; animation:fadeIn 0.3s ease; }
  .bubble-row.vincenzo { flex-direction:row-reverse; align-self:flex-end; }
  .bubble-row.other { align-self:flex-start; }

  .avatar { width:36px; min-width:36px; height:36px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:16px; flex-shrink:0; margin-top:2px; }

  .bubble { padding:14px 18px; max-width:100%; min-width:100px; transition:all 0.2s; }
  .bubble.other { background:var(--bubble-bg); border-radius:4px var(--radius) var(--radius) var(--radius); border:1px solid rgba(50,50,58,0.3); }
  .bubble.vincenzo { background:var(--bubble-v-bg); border-radius:var(--radius) 4px var(--radius) var(--radius); border:none; }
  .bubble.vincenzo .bubble-name { color:#fff !important; }
  .bubble.vincenzo .bubble-role { color:rgba(255,255,255,0.5); }
  .bubble.vincenzo .bubble-date { color:rgba(255,255,255,0.4); }
  .bubble.vincenzo .bubble-subject { color:#fff; background:rgba(255,255,255,0.1); border-left-color:rgba(255,255,255,0.3); }
  .bubble.vincenzo .bubble-body { color:rgba(255,255,255,0.92); }
  .bubble.vincenzo .expand-btn { color:rgba(255,255,255,0.6) !important; }

  .bubble-header { display:flex; align-items:baseline; gap:8px; margin-bottom:6px; flex-wrap:wrap; }
  .bubble-name { font-weight:700; font-size:14px; letter-spacing:0.04em; }
  .bubble-role { font-size:10px; color:var(--text3); text-transform:uppercase; letter-spacing:0.08em; font-weight:400; }
  .bubble-date { font-size:10px; color:var(--text4); margin-left:auto; white-space:nowrap; font-weight:300; letter-spacing:0.02em; }

  .bubble-subject { font-size:13.5px; font-weight:600; color:var(--heading); margin-bottom:8px; padding:6px 12px; border-radius:10px; background:rgba(255,255,255,0.03); border-left:3px solid rgba(255,255,255,0.1); font-family:'Outfit',sans-serif; letter-spacing:0.01em; line-height:1.4; }

  .bubble-body { font-size:14px; color:var(--text); line-height:1.65; white-space:pre-wrap; word-break:break-word; overflow:hidden; position:relative; font-weight:300; }
  .bubble-body.collapsed { max-height:180px; }
  .bubble-fade { position:absolute; bottom:0; left:0; right:0; height:50px; pointer-events:none; }
  .expand-btn { background:none; border:none; cursor:pointer; font-size:11.5px; padding:4px 0; margin-top:4px; opacity:0.6; transition:opacity 0.2s; font-family:'Outfit',sans-serif; font-weight:400; }
  .expand-btn:hover { opacity:1; }

  .loading { display:flex; flex-direction:column; align-items:center; justify-content:center; height:100%; gap:14px; }
  .spinner { width:28px; height:28px; border:2px solid rgba(16,186,218,0.1); border-top:2px solid var(--cyan); border-radius:50%; animation:spin 1s linear infinite; }
  .loading-text { font-size:12px; color:var(--text3); font-weight:300; }

  .compose { border-top:1px solid var(--border); padding:14px 20px; background:rgba(18,18,22,0.98); backdrop-filter:blur(12px); }
  .compose-header { display:flex; align-items:center; gap:8px; margin-bottom:8px; }
  .compose-avatar { width:28px; min-width:28px; height:28px; border-radius:50%; background:var(--cyan); display:flex; align-items:center; justify-content:center; font-size:13px; }
  .compose-name { font-weight:700; font-size:12px; color:var(--cyan); letter-spacing:0.04em; }
  .compose-date { font-size:9px; color:var(--text4); font-weight:300; }
  .compose-subject { width:100%; background:rgba(40,40,48,0.5); border:1px solid var(--border); border-radius:12px; padding:8px 14px; color:var(--heading); font-size:13px; font-weight:500; margin-bottom:6px; outline:none; font-family:'Outfit',sans-serif; letter-spacing:0.02em; transition:all 0.2s; }
  .compose-subject:focus { border-color:var(--cyan); box-shadow:0 0 0 3px rgba(16,186,218,0.08); }
  .compose-subject::placeholder { color:var(--text4); font-weight:300; }
  .compose-row { display:flex; gap:8px; align-items:flex-end; }
  .compose-body { flex:1; background:rgba(40,40,48,0.5); border:1px solid var(--border); border-radius:12px; padding:10px 14px; color:var(--text); font-size:14px; resize:none; outline:none; line-height:1.5; font-family:'Outfit',sans-serif; font-weight:300; transition:all 0.2s; min-height:42px; max-height:120px; }
  .compose-body:focus { border-color:var(--cyan); box-shadow:0 0 0 3px rgba(16,186,218,0.08); }
  .compose-body::placeholder { color:var(--text4); }
  .send-btn { border:none; border-radius:50%; width:42px; height:42px; min-width:42px; display:flex; align-items:center; justify-content:center; cursor:pointer; transition:all 0.3s; font-size:18px; }
  .send-btn.active { background:var(--cyan); color:var(--bg); box-shadow:0 4px 16px rgba(16,186,218,0.25); }
  .send-btn.active:hover { transform:scale(1.08); box-shadow:0 6px 20px rgba(16,186,218,0.35); }
  .send-btn.inactive { background:rgba(40,40,48,0.5); color:var(--text4); cursor:default; }
  .compose-hint { font-size:9px; color:var(--text4); margin-top:5px; text-align:right; font-weight:300; }

  @media(max-width:640px) {
    .header { padding:10px 14px; }
    .chat { padding:10px 14px; }
    .compose { padding:10px 14px; }
    .bubble-row { max-width:92%; }
    .search-input { width:90px; }
    .header-title { font-size:13px; }
  }
</style>
</head>
<body>

<div class="header">
  <div class="header-left">
    <img src="https://vincenzosalvia.wordpress.com/wp-content/uploads/2026/03/workspace-logo.png" alt="" class="header-logo" onerror="this.style.display='none'">
    <div>
      <div class="header-title title-font">VS Studio Workspace</div>
      <div class="header-sub" id="headerSub">Caricamento...</div>
    </div>
  </div>
  <div class="header-right">
    <input type="text" class="search-input" id="searchInput" placeholder="Cerca...">
    <button class="btn" id="refreshBtn" onclick="doRefresh()" title="Ricarica dal Google Doc">↻</button>
    <button class="btn" onclick="document.getElementById('topAnchor').scrollIntoView({behavior:'smooth'})" title="Vai in cima">⬆</button>
    <button class="btn" onclick="document.getElementById('endAnchor').scrollIntoView({behavior:'smooth'})" title="Vai in fondo">⬇</button>
  </div>
</div>

<div class="filters" id="filters"></div>
<div class="status" id="statusBar" style="display:none"></div>

<div class="chat" id="chat">
  <div id="topAnchor"></div>
  <div class="loading" id="loadingState">
    <div class="spinner"></div>
    <div class="loading-text">Caricamento Workspace dal Google Doc...</div>
  </div>
  <div id="endAnchor"></div>
</div>

<div class="compose">
  <div class="compose-header">
    <div class="compose-avatar">🎹</div>
    <span class="compose-name title-font">Vincenzo Salvia</span>
    <span class="compose-date" id="composeDate"></span>
  </div>
  <input type="text" class="compose-subject" id="subjectInput" placeholder="Oggetto (opzionale)">
  <div class="compose-row">
    <textarea class="compose-body" id="bodyInput" rows="1" placeholder="Scrivi un messaggio..."></textarea>
    <button class="send-btn inactive" id="sendBtn" onclick="handleSend()">➤</button>
  </div>
  <div class="compose-hint">⌘+Enter per inviare</div>
</div>

<script>
const GAS_URL = "https://script.google.com/macros/s/AKfycbwmRe-xE47HZZJn6c6sPZBrUAtDgviMBNPJOEs9zk6npQRhxWyFTvFfPceo__gGPVef/exec";
const MN = ["Gennaio","Febbraio","Marzo","Aprile","Maggio","Giugno","Luglio","Agosto","Settembre","Ottobre","Novembre","Dicembre"];
const ML = {gennaio:"01",febbraio:"02",marzo:"03",aprile:"04",maggio:"05",giugno:"06",luglio:"07",agosto:"08",settembre:"09",ottobre:"10",novembre:"11",dicembre:"12"};

const TEAM = {
  "VINCENZO SALVIA":{name:"Vincenzo Salvia",label:"Vincenzo",role:"CEO",color:"#10BADA",emoji:"🎹"},
  "MARTINA GENTILE":{name:"Martina Gentile",label:"Martina",role:"Studio Manager",color:"#ff7dab",emoji:"📋"},
  "ELEONORA GALLI":{name:"Eleonora Galli",label:"Eleonora",role:"Management",color:"#267aaa",emoji:"📊"},
  "ALICE CYBERDIVA":{name:"Alice Cyberdiva",label:"Alice",role:"Client Assistant",color:"#5EC4B3",emoji:"🤖"},
  "GIORGIA ESPOSITO":{name:"Giorgia Esposito",label:"Giorgia",role:"Creative Director",color:"#B88FCC",emoji:"🎨"},
  "CHIARA PELLEGRINO":{name:"Chiara Pellegrino",label:"Chiara",role:"Press Office",color:"#D4A06B",emoji:"📰"},
  "VITTORIA BENEDETTI":{name:"Vittoria Benedetti",label:"Vittoria",role:"Blog & Web",color:"#8FBF6B",emoji:"✍️"},
};

let rawText="", allMessages=[], currentFilter="all", sending=false;

document.getElementById("composeDate").textContent = new Date().toLocaleDateString("it-IT",{day:"numeric",month:"long",year:"numeric"});
document.getElementById("searchInput").addEventListener("input",render);
document.getElementById("bodyInput").addEventListener("input",function(){
  document.getElementById("sendBtn").className = this.value.trim()?"send-btn active":"send-btn inactive";
  this.style.height = 'auto';
  this.style.height = Math.min(this.scrollHeight, 120) + 'px';
});
document.addEventListener("keydown",function(e){ if(e.key==="Enter"&&(e.metaKey||e.ctrlKey))handleSend(); });

function findAuthor(t){
  const u=t.toUpperCase().trim().replace(/[*\\]/g,"");
  for(const k of Object.keys(TEAM)) if(u.startsWith(k)||u.includes(k)) return k;
  const m={VINCENZO:"VINCENZO SALVIA",MARTINA:"MARTINA GENTILE",ELEONORA:"ELEONORA GALLI",ALICE:"ALICE CYBERDIVA",GIORGIA:"GIORGIA ESPOSITO",CHIARA:"CHIARA PELLEGRINO",VITTORIA:"VITTORIA BENEDETTI"};
  for(const[k,v]of Object.entries(m)) if(u.includes(k)) return v;
  return null;
}
function findDate(t){
  const m=t.match(/(\d{1,2})\s+(gennaio|febbraio|marzo|aprile|maggio|giugno|luglio|agosto|settembre|ottobre|novembre|dicembre)\s+(\d{4})/i);
  return m?{display:`${m[1]} ${m[2].charAt(0).toUpperCase()+m[2].slice(1).toLowerCase()} ${m[3]}`,sort:+m[3]*10000+ +ML[m[2].toLowerCase()]*100+ +m[1]}:null;
}
function findSubject(lines){
  for(let i=0;i<Math.min(lines.length,3);i++){
    const l=lines[i].trim();
    if(!l) continue;
    return{subj:l,skip:i+1};
  }
  return{subj:null,skip:0};
}
function parseDoc(raw){
  if(!raw) return[];
  let norm = raw.replace(/[\u2014\u2013\u2012]{3,}/g, '----------');
  norm = norm.replace(/\r\n/g, '\n');
  norm = norm.replace(/-{3,}\s*((?:Vincenzo Salvia|Martina Gentile|Eleonora Galli|Alice Cyberdiva|Giorgia Esposito|Chiara Pellegrino|Vittoria Benedetti|VINCENZO SALVIA|MARTINA GENTILE|ELEONORA GALLI|ALICE CYBERDIVA|GIORGIA ESPOSITO|CHIARA PELLEGRINO|VITTORIA BENEDETTI))/gi, '\n----------\n$1');
  norm = norm.replace(/((?:gennaio|febbraio|marzo|aprile|maggio|giugno|luglio|agosto|settembre|ottobre|novembre|dicembre)\s+\d{4})\s*([A-ZÀ-Ú]{2,})/gi, '$1\n$2');
  norm = norm.replace(/([A-ZÀ-Ú\s?!.]{8,}[?!.])\s*([A-ZÀ-Ú][a-zà-ú])/g, '$1\n$2');

  const blocks = norm.split(/\n[ \t]*-{3,}[ \t]*\n/);
  const msgs=[];
  
  for(const block of blocks){
    const t=block.trim(); if(!t||t.length<15) continue;
    const authorDatePattern = /\n\s*\n+((?:VINCENZO SALVIA|MARTINA GENTILE|ELEONORA GALLI|ALICE CYBERDIVA|GIORGIA ESPOSITO|CHIARA PELLEGRINO|VITTORIA BENEDETTI|Vincenzo Salvia|Martina Gentile|Eleonora Galli|Alice Cyberdiva|Giorgia Esposito|Chiara Pellegrino|Vittoria Benedetti)\s*[-–—]\s*\d{1,2}\s+(?:gennaio|febbraio|marzo|aprile|maggio|giugno|luglio|agosto|settembre|ottobre|novembre|dicembre)\s+\d{4})/gi;
    const subBlocks = [];
    let lastIdx = 0;
    let match;
    authorDatePattern.lastIndex = 0;
    while((match = authorDatePattern.exec(t)) !== null) {
      const before = t.substring(lastIdx, match.index).trim();
      if(before.length > 10) subBlocks.push(before);
      lastIdx = match.index + (match[0].length - match[1].length);
    }
    const remaining = t.substring(lastIdx).trim();
    if(remaining.length > 10) subBlocks.push(remaining);
    if(subBlocks.length === 0) subBlocks.push(t);
    
    for(const sub of subBlocks) {
      const lines=sub.split("\n");
      let author=null,date=null,hEnd=0;
      for(let i=0;i<Math.min(5,lines.length);i++){
        const l=lines[i].trim(); if(!l) continue;
        if(!author){author=findAuthor(l);if(author){hEnd=i+1;date=findDate(l);}}
        if(!date){date=findDate(l);if(date&&i>=hEnd)hEnd=i+1;}
        if(author&&date) break;
      }
      if(!author) continue;
      const c=lines.slice(hEnd);
      const{subj,skip}=findSubject(c);
      const body=c.slice(skip).join("\n").trim();
      if(!body&&!subj) continue;
      msgs.push({id:msgs.length,authorKey:author,date:date?.display||"—",sortKey:date?.sort||0,subject:subj,body});
    }
  }
  return msgs;
}
function esc(s){return s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");}

function render(){
  const chat=document.getElementById("chat");
  const q=document.getElementById("searchInput").value.toLowerCase();
  let msgs=allMessages;
  if(currentFilter!=="all") msgs=msgs.filter(m=>m.authorKey===currentFilter);
  if(q) msgs=msgs.filter(m=>(m.subject||"").toLowerCase().includes(q)||(m.body||"").toLowerCase().includes(q));

  let html='<div id="topAnchor"></div>';
  let prev=null;
  for(const msg of msgs){
    const m=TEAM[msg.authorKey]||{name:msg.authorKey,color:"#888",emoji:"❓",role:""};
    const isV=msg.authorKey==="VINCENZO SALVIA";
    const side=isV?"vincenzo":"other";
    const fadeBg=isV?"var(--bubble-v-bg)":"var(--bubble-bg)";
    const long=msg.body?.length>500;
    const uid="m"+msg.id;

    if(msg.date!==prev){
      html+=`<div class="date-sep"><span class="date-label">${esc(msg.date)}</span></div>`;
      prev=msg.date;
    }
    html+=`<div class="bubble-row ${side}">`;
    html+=`<div class="avatar" style="background:linear-gradient(145deg,${m.color}CC,${m.color}55);box-shadow:0 2px 10px ${m.color}15">${m.emoji}</div>`;
    html+=`<div class="bubble ${side}">`;
    html+=`<div class="bubble-header">`;
    html+=`<span class="bubble-name title-font" style="color:${m.color}">${esc(m.name)}</span>`;
    html+=`<span class="bubble-role">${esc(m.role)}</span>`;
    html+=`<span class="bubble-date">${esc(msg.date)}</span>`;
    html+=`</div>`;
    if(msg.subject) html+=`<div class="bubble-subject" style="border-left-color:${isV?'rgba(255,255,255,0.3)':m.color+'40'}">${esc(msg.subject)}</div>`;
    html+=`<div class="bubble-body${long?' collapsed':''}" id="${uid}">${esc(msg.body)}`;
    if(long) html+=`<div class="bubble-fade" style="background:linear-gradient(transparent,${fadeBg})"></div>`;
    html+=`</div>`;
    if(long) html+=`<button class="expand-btn" style="color:${isV?'rgba(255,255,255,0.6)':m.color}" onclick="toggleMsg('${uid}','${fadeBg}',this)">▼ leggi tutto</button>`;
    html+=`</div></div>`;
  }
  html+='<div id="endAnchor"></div>';
  chat.innerHTML=html;
  document.getElementById("headerSub").textContent=`${allMessages.length} messaggi`;
  renderFilters();
}

function toggleMsg(uid,bg,btn){
  const el=document.getElementById(uid);
  if(el.classList.contains("collapsed")){
    el.classList.remove("collapsed");
    const fade=el.querySelector(".bubble-fade"); if(fade) fade.remove();
    btn.textContent="▲ comprimi";
  } else {
    el.classList.add("collapsed");
    const d=document.createElement("div"); d.className="bubble-fade"; d.style.background=`linear-gradient(transparent,${bg})`;
    el.appendChild(d);
    btn.textContent="▼ leggi tutto";
  }
}

function renderFilters(){
  const f=document.getElementById("filters");
  const counts={all:allMessages.length};
  for(const k of Object.keys(TEAM)) counts[k]=allMessages.filter(m=>m.authorKey===k).length;
  const items=[{key:"all",label:"Tutti",color:"var(--cyan)"},...Object.entries(TEAM).map(([k,v])=>({key:k,label:v.label,emoji:v.emoji,color:v.color}))];
  let html="";
  for(const item of items){
    const active=currentFilter===item.key;
    html+=`<button class="filter-btn${active?' active':''}" style="background:${active?item.color+'10':'transparent'};border-color:${active?item.color+'25':'transparent'};color:${active?item.color:'var(--text3)'}" onclick="setFilter('${item.key}')">`;
    if(item.emoji) html+=`<span style="margin-right:3px">${item.emoji}</span>`;
    html+=`${item.label}<span class="filter-count">${counts[item.key]||0}</span></button>`;
  }
  f.innerHTML=html;
}

function setFilter(key){currentFilter=key;render();}

function showStatus(type,text){
  const bar=document.getElementById("statusBar");
  bar.className="status "+type; bar.textContent=text; bar.style.display="block";
  setTimeout(()=>{bar.style.display="none";},3000);
}

async function fetchDoc(){
  try{
    const res=await fetch(GAS_URL,{redirect:"follow"});
    if(!res.ok) throw new Error(res.status);
    const text=await res.text();
    if(text.length>500){
      rawText=text; allMessages=parseDoc(text);
      try{localStorage.setItem("ws-cache",text);}catch(e){}
      return true;
    }
  }catch(e){console.error("Fetch error:",e);}
  return false;
}

async function doRefresh(){
  const btn=document.getElementById("refreshBtn");
  btn.classList.add("spinning");
  const ok=await fetchDoc();
  btn.classList.remove("spinning");
  if(ok){render();showStatus("refreshed","✓ Aggiornato dal Google Doc");scrollToBottom();}
  else showStatus("error","✗ Errore nel caricamento");
}

async function handleSend(){
  const bodyEl=document.getElementById("bodyInput");
  const subjEl=document.getElementById("subjectInput");
  if(!bodyEl.value.trim()||sending) return;
  sending=true;
  const btn=document.getElementById("sendBtn");
  btn.textContent="…";

  const d=new Date();
  let text=`VINCENZO SALVIA - ${d.getDate()} ${MN[d.getMonth()]} ${d.getFullYear()}`;
  if(subjEl.value.trim()) text+=`\n${subjEl.value.trim().toUpperCase()}`;
  text+=`\n\n${bodyEl.value.trim()}`;

  try{
    const res=await fetch(GAS_URL,{
      method:"POST",
      headers:{"Content-Type":"text/plain;charset=utf-8"},
      body:JSON.stringify({text:text}),
      redirect:"follow"
    });
    const result=await res.json();
    if(result.status==="ok"){
      rawText+=`\n\n----------\n\n${text}`;
      allMessages=parseDoc(rawText);
      try{localStorage.setItem("ws-cache",rawText);}catch(e){}
      subjEl.value=""; bodyEl.value=""; bodyEl.style.height='auto';
      btn.className="send-btn inactive";
      render();
      showStatus("sent","✓ Aggiunto al Workspace");
      setTimeout(scrollToBottom,200);
    } else { throw new Error(result.message||"unknown"); }
  }catch(e){console.error(e);showStatus("error","✗ Errore nell'invio");}
  finally{sending=false;btn.textContent="➤";}
}

function scrollToBottom(){
  setTimeout(()=>{document.getElementById("endAnchor")?.scrollIntoView({behavior:"smooth"});},100);
}

(async function(){
  try{
    const cached=localStorage.getItem("ws-cache");
    if(cached?.length>500){
      rawText=cached; allMessages=parseDoc(cached);
      document.getElementById("loadingState").style.display="none";
      render(); scrollToBottom();
    }
  }catch(e){}

  const ok=await fetchDoc();
  document.getElementById("loadingState").style.display="none";
  if(ok){render();scrollToBottom();}
  else if(!allMessages.length){
    document.getElementById("chat").innerHTML='<div style="display:flex;flex-direction:column;align-items:center;justify-content:center;height:100%;gap:14px;text-align:center"><div style="font-size:32px">📋</div><div style="font-size:13px;color:var(--text3)">Errore nel caricamento. Clicca ↻ per riprovare.</div></div>';
  }
})();
</script>
